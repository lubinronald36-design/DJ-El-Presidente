<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyChillingTime — Interactive Music</title>

<style>
body{background:#0b0d12;color:#eaeaff;font-family:system-ui;padding:20px}
.card{background:#15182a;border-radius:14px;padding:16px;margin-bottom:14px}
button{padding:10px 14px;border-radius:10px;font-weight:700;border:none;cursor:pointer}
.start{background:#fff;color:#000}
.stop{background:#ff4d4d;color:#fff}
kbd{background:#22265a;border:1px solid #3b4099;border-radius:8px;padding:6px 10px;margin:3px;display:inline-block}
.status{color:#9fa8ff;margin-top:8px}
</style>
</head>

<body>
<h1>🎵 MyChillingTime</h1>

<div class="card">
  <button id="playBtn" class="start">▶ Start Beat</button>
  <button id="stopBtn" class="stop" disabled>■ Stop Beat</button>
  <div id="status" class="status">Ready</div>
</div>

<div class="card">
  <p><strong>Keyboard</strong></p>
  <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd>
</div>

<script>
const beat = new Audio("bott.mp3");
beat.loop = true;

let ctx;
function playBeep(freq=440){
  if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type="sine";
  o.frequency.value=freq;
  g.gain.value=0.15;
  o.connect(g); g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime+0.12);
}

playBtn.onclick=()=>{
  beat.play();
  playBtn.disabled=true;
  stopBtn.disabled=false;
  status.textContent="Beat playing";
}

stopBtn.onclick=()=>{
  beat.pause();
  beat.currentTime=0;
  playBtn.disabled=false;
  stopBtn.disabled=true;
  status.textContent="Stopped";
}

window.addEventListener("keydown",e=>{
  const k=e.key.toUpperCase();
  if("ASDFGHJ".includes(k)){
    playBeep(300+Math.random()*600);
  }
});
</script>
</body>
</html>
